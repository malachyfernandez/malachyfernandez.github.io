<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=La+Belle+Aurore&family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">
  <style>
    @view-transition {
      navigation: auto;
    }
    :root {
      --desk: #1e1e1e;
      --paper: #a59f96;
      --paper-light: #c9c1b2;
      --ink: #1a1a1a;
      --ink-soft: #38332c;
      --muted: #6b655c;
      --gold: #9a7a33;
      --gold-light: #d9b458;
      --cream: #f0e7d3;
      --gold-od: #bf6c18;
      --gold-ol: #ecd9ab;
      --gold-mid: #d9b458;
      --gold-il: #c79a2e;
      --gold-id: #ba681e;
      --sil-od: #595f66;
      --sil-ol: #dde3e8;
      --sil-mid: #aeb5bd;
      --sil-il: #818a93;
      --sil-id: #6f7780;
      --transition: 0.3s ease;
      --font-script: 'La Belle Aurore', cursive;
      --font-head: 'Special Elite', 'Courier New', monospace;
      --font-body: 'Crimson Text', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--desk);
      /* Warm lamp glow from above + vignette — reads as a physical desk */
      background-image:
        radial-gradient(ellipse 90% 45% at 50% -5%, rgba(217,180,88,0.09), transparent 70%),
        radial-gradient(ellipse 130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,0.4) 100%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
    }

    /* --- HEADER: dark desk, blood moon, script nameplate --- */
    header {
      position: relative;
      text-align: center;
      padding: 3.4rem 1rem 2.4rem;
      overflow: hidden;
    }
    .moon {
      position: absolute;
      top: -46px;
      right: 12%;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #ff6a5c 0%, #b31212 52%, #6d0a0a 100%);
      box-shadow: 0 0 90px 14px rgba(255, 70, 50, 0.22);
      opacity: 0.85;
      pointer-events: none;
    }
    header h1 {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.3rem;
      width: fit-content;
      margin: 0 auto;
      view-transition-name: header-title;
    }
    .profile-photo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow:
        0 0 0 2px var(--gold-id),
        0 0 0 5px var(--gold-mid),
        0 0 0 6px #6d4a14,
        0 5px 14px rgba(0,0,0,0.55);
      view-transition-name: profile-photo;
    }
    .name-script {
      font-family: var(--font-script);
      font-size: 3.7rem;
      color: var(--cream);
      line-height: 1.05;
      text-shadow: 0 3px 14px rgba(0,0,0,0.65), 0 0 34px rgba(217,180,88,0.18);
    }
    .header-sub {
      position: relative;
      z-index: 1;
      margin-top: 1rem;
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(240,231,211,0.55);
      view-transition-name: header-nav;
    }

    /* --- THE SHEET: one long torn manila page on the desk --- */
    .container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.1rem;
    }
    .sheet-wrap {
      position: relative;
      z-index: 2;
    }
    .sheet-shadow {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 5px 14px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .sheet {
      position: relative;
      background-color: var(--paper);
      clip-path: var(--tear);
      padding: 2.8rem 2.2rem 4.2rem;
    }
    .sheet::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url('../assets/paper-texture.jpg'),
        radial-gradient(ellipse 115% 90% at 50% 42%, transparent 55%, rgba(54,41,22,0.6) 100%);
      background-repeat: repeat, no-repeat;
      background-size: 642px 642px, 100% 100%;
      mix-blend-mode: multiply;
      opacity: 0.45;
      pointer-events: none;
    }
    .sheet > * {
      position: relative;
      z-index: 1;
    }

    /* --- FOLDER TABS: tucked behind the sheet's torn top edge --- */
    .tab-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.6rem;
      padding: 0 1rem;
      margin-bottom: -14px;
    }
    .ftab {
      position: relative;
      display: inline-block;
      padding: 5px 5px 0;
      border-radius: 13px 13px 0 0;
      background: linear-gradient(to bottom, var(--sil-ol) 20%, var(--sil-od) 80%);
      filter: drop-shadow(0 -3px 4px rgba(0,0,0,0.35));
      transform: translateY(6px);
      transition: transform var(--transition), filter var(--transition);
      text-decoration: none;
      cursor: pointer;
    }
    .ftab::before {
      content: '';
      position: absolute;
      top: 1px; left: 1px; right: 1px; bottom: 0;
      border-radius: 12px 12px 0 0;
      background: var(--sil-mid);
    }
    .ftab-in {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.15rem 0.7rem;
      border-radius: 9px 9px 0 0;
      background: #7a7368;
      color: #ddd5c3;
      font-family: var(--font-head);
      font-size: 0.75rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .ftab-in i { font-size: 0.85rem; }
    .ftab:hover { transform: translateY(2px); }
    .ftab.active { transform: translateY(0); }
    .ftab.active .ftab-in {
      background: var(--paper);
      color: var(--ink);
      box-shadow: inset 0 2px 5px -3px rgba(255,255,255,0.5);
    }

    /* --- ABOUT LAYOUT: resume clippings pinned to the sheet --- */
    #content {
      display: grid;
      grid-template-columns: 1.85fr 1fr;
      gap: 1.9rem;
      align-items: start;
      view-transition-name: page-content;
    }
    @media (max-width: 860px) {
      #content { grid-template-columns: 1fr; }
    }
    .about-main, .about-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.9rem;
      min-width: 0;
    }

    /* --- CLIPPINGS: torn scraps of lighter paper --- */
    .clip {
      position: relative;
      padding: 1.5rem 1.5rem 1.7rem;
    }
    .clip::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--paper-light);
      clip-path: var(--tear);
      /* drop-shadow follows the torn silhouette, unlike box-shadow */
      filter: drop-shadow(0 7px 15px rgba(30,25,15,0.32));
      z-index: 0;
    }
    .clip::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url('../assets/paper-texture.jpg'),
        radial-gradient(ellipse 150% 130% at 50% 50%, transparent 58%, rgba(74,55,30,0.42) 100%);
      background-repeat: repeat, no-repeat;
      background-size: 642px 642px, 100% 100%;
      mix-blend-mode: multiply;
      opacity: 0.38;
      clip-path: var(--tear);
      pointer-events: none;
      z-index: 0;
    }
    .clip > * {
      position: relative;
      z-index: 1;
    }
    .clip h3 {
      font-family: var(--font-head);
      font-size: 1.18rem;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.7rem;
      padding-bottom: 0.45rem;
      border-bottom: 3px double rgba(26,26,26,0.4);
    }
    .clip p {
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .item-title {
      font-family: var(--font-head);
      font-size: 0.98rem;
      letter-spacing: 0.5px;
      color: var(--ink);
      margin-bottom: 0;
      line-height: 1.4;
    }
    .item-date {
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 0.1rem;
      margin-bottom: 0.35rem;
      color: var(--gold);
    }
    .item-desc {
      font-size: 1rem;
      margin-bottom: 0.4rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }
    .item-block + .item-block {
      margin-top: 1.3rem;
      padding-top: 1rem;
      border-top: 1px dashed rgba(26,26,26,0.3);
    }

    /* --- GILDED CHROME: scooped-corner machined plates --- */
    /* Scoop mask: a quarter-disc carved from each corner. Each nested
       ring layer re-centers the discs on its own outer corner and grows
       the radius by the ring thickness, so the rings nest cleanly. */
    .gb-frame, .gb-frame::before, .gb-frame::after, .gb-inner {
      -webkit-mask:
        radial-gradient(circle at var(--so, 0px) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top right / 51% 51%,
        radial-gradient(circle at var(--so, 0px) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom right / 51% 51%;
      -webkit-mask-repeat: no-repeat;
      mask:
        radial-gradient(circle at var(--so, 0px) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top right / 51% 51%,
        radial-gradient(circle at var(--so, 0px) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom right / 51% 51%;
      mask-repeat: no-repeat;
    }
    .gb {
      --r: 13px;
      --t-out: 2px;
      --t-mid: 4px;
      --t-in: 2px;
      display: inline-block;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
      transition: transform 0.15s ease, filter 0.15s ease;
      text-decoration: none;
    }
    .gb:hover { transform: translateY(2px); filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
    .gb:active { transform: translateY(3px); filter: drop-shadow(0 0 1px rgba(0,0,0,0.35)); }
    .gb-frame {
      position: relative;
      display: block;
      padding: calc(var(--t-out) + var(--t-mid) + var(--t-in));
      background: linear-gradient(to top right, var(--rod) 45%, var(--rol) 55%);
      --sr: var(--r);
    }
    .gb-frame::before {
      content: '';
      position: absolute;
      inset: var(--t-out);
      background: var(--rmid);
      --so: calc(-1 * var(--t-out));
      --sor: calc(100% + var(--t-out));
      --sr: calc(var(--r) + var(--t-out));
    }
    .gb-frame::after {
      content: '';
      position: absolute;
      inset: calc(var(--t-out) + var(--t-mid));
      background: linear-gradient(to top right, var(--ril) 45%, var(--rid) 55%);
      --so: calc(-1 * (var(--t-out) + var(--t-mid)));
      --sor: calc(100% + var(--t-out) + var(--t-mid));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid));
    }
    .gb-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1.15rem;
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      white-space: nowrap;
      background: #26251f;
      color: #ece4cf;
      box-shadow: inset 0 2px 7px rgba(0,0,0,0.55), inset 0 -1px 2px rgba(255,255,255,0.07);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      --so: calc(-1 * (var(--t-out) + var(--t-mid) + var(--t-in)));
      --sor: calc(100% + var(--t-out) + var(--t-mid) + var(--t-in));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid) + var(--t-in));
    }
    .gb-inner i { font-size: 0.85em; }
    .gb-silver { --rod: var(--sil-od); --rol: var(--sil-ol); --rmid: var(--sil-mid); --ril: var(--sil-il); --rid: var(--sil-id); }
    .gb-gold   { --rod: var(--gold-od); --rol: var(--gold-ol); --rmid: var(--gold-mid); --ril: var(--gold-il); --rid: var(--gold-id); }

    /* --- CONTACT: stacked gilded plates --- */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      align-items: stretch;
    }
    .contact-list .gb { display: block; }
    .contact-list .gb-inner {
      justify-content: flex-start;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      white-space: normal;
      word-break: break-word;
    }
    .contact-list .gb-inner i { flex-shrink: 0; }

    .sidebar-note {
      font-style: italic;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .version-number {
      position: fixed;
      top: 10px;
      right: 12px;
      font-size: 10px;
      font-family: var(--font-head);
      color: rgba(240,231,211,0.4);
      z-index: 1000;
    }

    /* --- NATIVE VIEW TRANSITIONS --- */
    header { view-transition-name: main-header; }

    ::view-transition-old(page-content) {
      animation: fade-out 0.2s cubic-bezier(0.4, 0, 1, 1) both;
    }
    ::view-transition-new(page-content) {
      animation: slide-up 0.4s cubic-bezier(0, 0, 0.2, 1) both;
    }
    @keyframes fade-out {
      to { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Prevent the blurry crossfade on persistent elements */
    ::view-transition-old(main-header),
    ::view-transition-old(profile-photo) {
      display: none;
    }
    ::view-transition-new(main-header),
    ::view-transition-new(profile-photo) {
      animation: none;
    }

    /* --- SMALL DESKS --- */
    @media (max-width: 700px) {
      header { padding: 2.6rem 1rem 2rem; }
      .name-script { font-size: 2.7rem; }
      .profile-photo { width: 62px; height: 62px; }
      .moon { width: 140px; height: 140px; top: -30px; right: 4%; }
      .container { padding: 0 0.6rem; }
      .sheet { padding: 2.2rem 1.1rem 3.4rem; }
      .ftab-in { padding: 0.5rem 0.8rem 0.65rem; font-size: 0.66rem; letter-spacing: 1px; }
      .clip { padding: 1.2rem 1.1rem 1.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gb, .ftab { transition: none; }
    }
  </style>
</head>
<body>
  <div class="version-number">v2.1</div>

  <header>
    <div class="moon"></div>
    <h1 id="site-title">
      <img src="../goated-photo.jpg" alt="Malachy Fernandez" class="profile-photo">
      <span class="name-script">Malachy Fernandez</span>
    </h1>
    <div class="header-sub">About Me</div>
  </header>

  <div class="container">
    <nav class="tab-row" id="navigation"></nav>
    <div class="sheet-wrap">
      <div class="sheet-shadow"></div>
      <div class="sheet" id="sheet">
        <div id="content">
          <!-- Content will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <script src="../config/site.js"></script>
  <script src="../config/about.js"></script>
  <script>
    // --- Torn paper edges: deterministic jagged clip-paths ---
    function buildTornClipPath(width, height, seedStart, topDepthScale = 1) {
      let seed = seedStart;
      const rand = () => {
        seed = (seed * 48271) % 2147483647;
        return seed / 2147483647;
      };
      const depth = () => (rand() < 0.15 ? 4 + rand() * 5 : rand() * 4.5);
      const jag = () => `${(depth()).toFixed(1)}px`;
      const jagTop = () => `${(depth() * topDepthScale).toFixed(1)}px`;
      const jagFromFar = () => `calc(100% - ${depth().toFixed(1)}px)`;
      const PX_PER_POINT = 7;
      const edgePoints = (length) => {
        const count = Math.max(4, Math.round(length / PX_PER_POINT));
        const points = [];
        for (let i = 0; i <= count; i++) {
          const jitter = i === 0 || i === count ? 0 : (rand() - 0.5) * (0.8 / count);
          points.push(Math.min(1, Math.max(0, i / count + jitter)));
        }
        return points;
      };
      const xs = edgePoints(width);
      const ys = edgePoints(height);
      const pct = (f) => `${(f * 100).toFixed(2)}%`;
      const pts = [];
      xs.forEach((x) => pts.push(`${pct(x)} ${jagTop()}`));
      ys.slice(1).forEach((y) => pts.push(`${jagFromFar()} ${pct(y)}`));
      [...xs].reverse().slice(1).forEach((x) => pts.push(`${pct(x)} ${jagFromFar()}`));
      [...ys].reverse().slice(1, -1).forEach((y) => pts.push(`${jag()} ${pct(y)}`));
      return `polygon(${pts.join(', ')})`;
    }
    const CLIP_VARIANTS = [11, 37, 53, 71, 89, 103].map(s => buildTornClipPath(420, 260, s));
    let clipIndex = 0;
    const nextClip = () => CLIP_VARIANTS[clipIndex++ % CLIP_VARIANTS.length];

    // Build one gilded button plate (silver for GitHub, gold otherwise)
    function gildedLink(href, icon, text, target) {
      const isGithub = /github/i.test((href || '') + ' ' + text);
      const link = document.createElement('a');
      link.href = href;
      if (target) link.target = target;
      link.className = 'gb ' + (isGithub ? 'gb-silver' : 'gb-gold');
      const frame = document.createElement('span');
      frame.className = 'gb-frame';
      const inner = document.createElement('span');
      inner.className = 'gb-inner';
      const i = document.createElement('i');
      i.className = icon;
      inner.appendChild(i);
      inner.appendChild(document.createTextNode(text));
      frame.appendChild(inner);
      link.appendChild(frame);
      return link;
    }

    function initializeAboutMe() {
      document.getElementById('page-title').textContent = aboutMeConfig.title;

      // Folder tabs — About Me is the open folder here
      const navContainer = document.getElementById('navigation');
      siteConfig.navigation.forEach(item => {
        const isAbout = item.link === 'AboutMe/index.html';
        const tab = document.createElement('a');
        tab.className = 'ftab' + (isAbout ? ' active' : '');
        tab.href = isAbout ? 'index.html' : '../index.html';

        const inner = document.createElement('span');
        inner.className = 'ftab-in';
        const icon = document.createElement('i');
        icon.className = item.icon || 'fas fa-folder';
        inner.appendChild(icon);
        inner.appendChild(document.createTextNode(item.text));
        tab.appendChild(inner);
        navContainer.appendChild(tab);
      });

      const content = document.getElementById('content');
      const mainColumn = document.createElement('div');
      mainColumn.className = 'about-main';
      const sidebar = document.createElement('div');
      sidebar.className = 'about-sidebar';

      // Main resume sections as torn clippings
      aboutMeConfig.sections.forEach(section => {
        const clip = document.createElement('div');
        clip.className = 'clip';
        clip.style.setProperty('--tear', nextClip());

        const title = document.createElement('h3');
        title.textContent = section.title;
        clip.appendChild(title);

        if (section.content) {
          const p = document.createElement('p');
          p.textContent = section.content;
          clip.appendChild(p);
        } else if (section.items) {
          section.items.forEach(item => {
            const block = document.createElement('div');
            block.className = 'item-block';

            const t = document.createElement('p');
            t.className = 'item-title';
            t.innerHTML = `<strong>${item.title}</strong>`;
            block.appendChild(t);

            if (item.date) {
              const d = document.createElement('p');
              d.className = 'item-date';
              d.innerHTML = `<em>${item.date}</em>`;
              block.appendChild(d);
            }

            item.descriptions.forEach(desc => {
              const p = document.createElement('p');
              p.className = 'item-desc';
              p.textContent = desc;
              block.appendChild(p);
            });

            clip.appendChild(block);
          });
        }
        mainColumn.appendChild(clip);
      });

      // Sidebar: contact buttons, education, skills
      const contactClip = document.createElement('div');
      contactClip.className = 'clip';
      contactClip.style.setProperty('--tear', nextClip());
      const contactTitle = document.createElement('h3');
      contactTitle.textContent = 'Contact';
      contactClip.appendChild(contactTitle);
      const contactList = document.createElement('div');
      contactList.className = 'contact-list';
      aboutMeConfig.sidebar.contact.forEach(c => {
        contactList.appendChild(gildedLink(c.link, c.icon, c.text, c.target));
      });
      contactClip.appendChild(contactList);
      sidebar.appendChild(contactClip);

      const eduClip = document.createElement('div');
      eduClip.className = 'clip';
      eduClip.style.setProperty('--tear', nextClip());
      const eduTitle = document.createElement('h3');
      eduTitle.textContent = 'Education';
      eduClip.appendChild(eduTitle);
      aboutMeConfig.sidebar.education.forEach(edu => {
        const block = document.createElement('div');
        block.className = 'item-block';
        const t = document.createElement('p');
        t.className = 'item-title';
        t.innerHTML = `<strong>${edu.school}</strong>`;
        const d = document.createElement('p');
        d.className = 'item-date';
        d.innerHTML = `<em>${edu.years}</em>`;
        block.appendChild(t);
        block.appendChild(d);
        eduClip.appendChild(block);
      });
      sidebar.appendChild(eduClip);

      const skillsClip = document.createElement('div');
      skillsClip.className = 'clip';
      skillsClip.style.setProperty('--tear', nextClip());
      const skillsTitle = document.createElement('h3');
      skillsTitle.textContent = 'Skills';
      skillsClip.appendChild(skillsTitle);
      aboutMeConfig.sidebar.skills.forEach(skill => {
        const block = document.createElement('div');
        block.className = 'item-block';
        const t = document.createElement('p');
        t.className = 'item-title';
        t.innerHTML = `<strong>${skill.category}</strong>`;
        const d = document.createElement('p');
        d.className = 'item-desc';
        d.textContent = skill.items.join(', ');
        block.appendChild(t);
        block.appendChild(d);
        skillsClip.appendChild(block);
      });
      sidebar.appendChild(skillsClip);

      content.appendChild(mainColumn);
      content.appendChild(sidebar);
    }

    // Initialize the page immediately so View Transition can see it
    initializeAboutMe();

    // Tear the big sheet — gentler on top where the folder tabs attach
    const sheet = document.getElementById('sheet');
    const setSheetTear = () => {
      sheet.style.setProperty('--tear', buildTornClipPath(sheet.offsetWidth, sheet.offsetHeight, 7, 0.25));
    };
    setSheetTear();
    if (window.ResizeObserver) {
      new ResizeObserver(setSheetTear).observe(sheet);
    }
  </script>
</body>
</html>
