<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=La+Belle+Aurore&family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <style>
    @view-transition {
      navigation: auto;
    }
    :root {
      --desk: #1e1e1e;
      --paper: #a59f96;
      --paper-light: #c9c1b2;
      --ink: #1a1a1a;
      --ink-soft: #38332c;
      --muted: #6b655c;
      --gold: #9a7a33;
      --gold-light: #d9b458;
      --cream: #f0e7d3;
      --gold-od: #bf6c18;
      --gold-ol: #ecd9ab;
      --gold-mid: #d9b458;
      --gold-il: #c79a2e;
      --gold-id: #ba681e;
      --sil-od: #595f66;
      --sil-ol: #dde3e8;
      --sil-mid: #aeb5bd;
      --sil-il: #818a93;
      --sil-id: #6f7780;
      --transition: 0.3s ease;
      --font-script: 'La Belle Aurore', cursive;
      --font-head: 'Special Elite', 'Courier New', monospace;
      --font-body: 'Crimson Text', Georgia, serif;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: var(--font-body);
      background-color: var(--desk);
      /* Warm lamp glow from above + vignette — reads as a physical desk */
      background-image:
        radial-gradient(ellipse 90% 45% at 50% -5%, rgba(217,180,88,0.09), transparent 70%),
        radial-gradient(ellipse 130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,0.4) 100%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
    }

    /* --- HEADER: dark desk, blood moon, script nameplate --- */
    header {
      position: relative;
      text-align: center;
      padding: 3.4rem 1rem 2.4rem;
      overflow: hidden;
    }
    .moon {
      position: absolute;
      top: -46px;
      right: 12%;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #ff6a5c 0%, #b31212 52%, #6d0a0a 100%);
      box-shadow: 0 0 90px 14px rgba(255, 70, 50, 0.22);
      opacity: 0.85;
      pointer-events: none;
    }
    header h1 {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.3rem;
      width: fit-content;
      margin: 0 auto;
      view-transition-name: header-title;
    }
    .profile-photo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow:
        0 0 0 2px var(--gold-id),
        0 0 0 5px var(--gold-mid),
        0 0 0 6px #6d4a14,
        0 5px 14px rgba(0,0,0,0.55);
    }
    .name-script {
      font-family: var(--font-script);
      font-size: 3.7rem;
      color: var(--cream);
      line-height: 1.05;
      text-shadow: 0 3px 14px rgba(0,0,0,0.65), 0 0 34px rgba(217,180,88,0.18);
    }
    .header-sub {
      position: relative;
      z-index: 1;
      margin-top: 1rem;
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(240,231,211,0.55);
      view-transition-name: header-nav;
    }

    /* --- THE SHEET: one long torn manila page on the desk --- */
    .container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.1rem;
    }
    .sheet-wrap {
      position: relative;
      z-index: 2;
      /* let clicks fall through the uncovered area to the tabs behind */
      pointer-events: none;
    }
    .sheet-wrap .sheet {
      /* clip-path limits hit-testing to the actual torn paper shape */
      pointer-events: auto;
    }
    .sheet-shadow {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 5px 14px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .sheet {
      position: relative;
      background-color: var(--paper);
      clip-path: var(--tear);
      padding: 2.8rem 2.2rem 4.2rem;
    }
    .sheet::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url('assets/paper-texture.jpg'),
        radial-gradient(ellipse 115% 90% at 50% 42%, transparent 55%, rgba(54,41,22,0.6) 100%);
      background-repeat: repeat, no-repeat;
      background-size: 642px 642px, 100% 100%;
      mix-blend-mode: multiply;
      opacity: 0.45;
      pointer-events: none;
    }
    .sheet > * {
      position: relative;
      z-index: 1;
    }

    /* --- FOLDER TABS --- */
    .tab-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.6rem;
      padding: 0 1rem;
      margin-bottom: -14px;
    }
    .ftab {
      display: inline-block;
      padding: 5px 5px 0;
      border-radius: 13px 13px 0 0;
      background: linear-gradient(to bottom, var(--sil-ol) 20%, var(--sil-od) 80%);
      filter: drop-shadow(0 -3px 4px rgba(0,0,0,0.35));
      transform: translateY(6px);
      transition: transform var(--transition), filter var(--transition);
      text-decoration: none;
      cursor: pointer;
    }
    .ftab::before {
      content: '';
      position: absolute;
      top: 1px; left: 1px; right: 1px; bottom: 0;
      border-radius: 12px 12px 0 0;
      background: var(--sil-mid);
    }
    .ftab-in {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.95rem 1.8rem 1.05rem;
      border-radius: 10px 10px 0 0;
      background: #7a7368;
      color: #ddd5c3;
      font-family: var(--font-head);
      font-size: 0.88rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .ftab-in i { font-size: 1rem; }
    .ftab:hover { transform: translateY(2px); }
    .ftab.active {
      transform: translateY(0);
    }
    .ftab.active .ftab-in {
      background: var(--paper);
      color: var(--ink);
      box-shadow: inset 0 2px 5px -3px rgba(255,255,255,0.5);
    }

    /* --- SECTION HEADINGS: typewriter title + ruled line --- */
    .projects-section {
      position: relative;
      z-index: 1;
      margin-bottom: 3.4rem;
    }
    .projects-section:last-child { margin-bottom: 0; }
    .projects-section h2 {
      font-family: var(--font-head);
      font-size: 1.35rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }
    .projects-section .section-subtext {
      font-style: italic;
      font-size: 1.02rem;
      color: var(--muted);
      padding-bottom: 0.6rem;
      margin-bottom: 1.7rem;
      border-bottom: 4px double rgba(26,26,26,0.45);
    }
    /* --- PROJECT CLIPPINGS: torn scraps of lighter paper on the sheet --- */
    .projects {
      display: grid;
      gap: 1.8rem;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      grid-auto-flow: dense;
      justify-content: center;
    }
    .project-card {
      position: relative;
      padding: 1.3rem 1.2rem 1.6rem;
      transition: transform var(--transition);
    }
    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--paper-light);
      clip-path: var(--tear);
      /* drop-shadow follows the torn silhouette, unlike box-shadow */
      filter: drop-shadow(0 8px 17px rgba(30,25,15,0.36));
      transition: filter var(--transition);
      z-index: 0;
    }
    .project-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url('assets/paper-texture.jpg'),
        radial-gradient(ellipse 150% 130% at 50% 50%, transparent 58%, rgba(74,55,30,0.42) 100%);
      background-repeat: repeat, no-repeat;
      background-size: 642px 642px, 100% 100%;
      mix-blend-mode: multiply;
      opacity: 0.38;
      clip-path: var(--tear);
      pointer-events: none;
      z-index: 0;
    }
    .card-content {
      position: relative;
      z-index: 1;
      text-align: center;
      transition: opacity var(--transition);
    }
    .card-photo {
      position: relative;
      padding: 5px;
      margin: 0 auto 0.95rem;
      background: #ece4d2;
      box-shadow: 0 2px 7px rgba(30,25,15,0.32);
      transform: rotate(-0.6deg);
      transition: transform var(--transition), opacity var(--transition);
    }
    .project-card:nth-child(even) .card-photo { transform: rotate(0.6deg); }
    .card-photo-img {
      height: 118px;
      background-size: cover;
      background-position: center;
      filter: sepia(0.42) contrast(0.93) brightness(0.96);
    }
    .card-content i.card-icon {
      font-size: 1.9rem;
      color: var(--ink);
      margin-bottom: 0.6rem;
      display: inline-block;
    }
    .card-content h3 {
      font-family: var(--font-head);
      font-size: 1.16rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }
    .card-content .type-label {
      font-family: var(--font-head);
      font-size: 0.7rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.55rem;
    }
    .card-content p.desc {
      font-size: 1.03rem;
      color: var(--ink-soft);
      line-height: 1.38;
    }
    .card-content .award {
      font-family: var(--font-head);
      font-size: 0.7rem;
      color: #fff;
      letter-spacing: 0.6px;
      margin-top: 0.85rem;
      padding: 0.35rem 0.8rem;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      box-shadow: 0 2px 7px rgba(154,122,51,0.5), inset 0 1px 1px rgba(255,255,255,0.45);
      display: inline-block;
    }
    .card-actions {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 0.7rem;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
      z-index: 4;
    }
    a { text-decoration: none; }

    /* --- Touch / Mobile Click Styles --- */
    .project-card.touch-active .card-content {
      opacity: 0.18;
    }
    .project-card.touch-active .card-actions {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- Mouse Hover Styles (Only applies to devices with a mouse) --- */
    @media (hover: hover) {
      .project-card:hover {
        transform: translateY(-5px) rotate(-0.4deg);
      }
      .project-card:hover::before {
        filter: drop-shadow(0 14px 26px rgba(30,25,15,0.42));
      }
      .project-card:hover .card-content {
        opacity: 0.18;
      }
      .project-card:hover .card-actions {
        opacity: 1;
        pointer-events: auto;
      }
      .project-card.highlight:hover {
        transform: translateY(-4px);
        filter: drop-shadow(0 18px 34px rgba(0,0,0,0.5));
      }
      .project-card.highlight:hover .card-content { opacity: 1; }
      .project-card.highlight:hover .highlight-img { transform: scale(1.06); }
    }

    /* --- GILDED CHROME: scooped-corner machined plates & frames --- */
    /* Scoop mask: a quarter-disc carved from each corner. Each nested
       ring layer re-centers the discs on its own outer corner and grows
       the radius by the ring thickness, so the rings nest cleanly. */
    .gb-frame, .gb-frame::before, .gb-frame::after, .gb-inner,
    .project-card.highlight, .project-card.highlight::before,
    .project-card.highlight::after, .highlight-surface,
    .archive-modal, .archive-modal::before, .archive-modal::after,
    .archive-surface {
      -webkit-mask:
        radial-gradient(circle at var(--so, 0px) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top right / 51% 51%,
        radial-gradient(circle at var(--so, 0px) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom right / 51% 51%;
      -webkit-mask-repeat: no-repeat;
      mask:
        radial-gradient(circle at var(--so, 0px) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--so, 0px), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) top right / 51% 51%,
        radial-gradient(circle at var(--so, 0px) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom left / 51% 51%,
        radial-gradient(circle at var(--sor, 100%) var(--sor, 100%), transparent var(--sr, 0px), black calc(var(--sr, 0px) + 0.5px)) bottom right / 51% 51%;
      mask-repeat: no-repeat;
    }

    .gb {
      --r: 13px;
      --t-out: 1px;
      --t-mid: 3px;
      --t-in: 1px;
      display: inline-block;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .gb:hover { transform: translateY(2px); filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
    .gb:active { transform: translateY(3px); filter: drop-shadow(0 0 1px rgba(0,0,0,0.35)); }
    .gb-frame {
      position: relative;
      display: block;
      padding: calc(var(--t-out) + var(--t-mid) + var(--t-in));
      background: linear-gradient(to top right, var(--rod) 45%, var(--rol) 55%);
      --sr: var(--r);
    }
    .gb-frame::before {
      content: '';
      position: absolute;
      inset: var(--t-out);
      background: var(--rmid);
      --so: calc(-1 * var(--t-out));
      --sor: calc(100% + var(--t-out));
      --sr: calc(var(--r) + var(--t-out));
    }
    .gb-frame::after {
      content: '';
      position: absolute;
      inset: calc(var(--t-out) + var(--t-mid));
      background: linear-gradient(to top right, var(--ril) 45%, var(--rid) 55%);
      --so: calc(-1 * (var(--t-out) + var(--t-mid)));
      --sor: calc(100% + var(--t-out) + var(--t-mid));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid));
    }
    .gb-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1.15rem;
      font-family: var(--font-head);
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      white-space: nowrap;
      background: #26251f;
      color: #ece4cf;
      box-shadow: inset 0 2px 7px rgba(0,0,0,0.55), inset 0 -1px 2px rgba(255,255,255,0.07);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      --so: calc(-1 * (var(--t-out) + var(--t-mid) + var(--t-in)));
      --sor: calc(100% + var(--t-out) + var(--t-mid) + var(--t-in));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid) + var(--t-in));
    }
    .gb-inner i { font-size: 0.85em; }
    .gb-silver { --rod: var(--sil-od); --rol: var(--sil-ol); --rmid: var(--sil-mid); --ril: var(--sil-il); --rid: var(--sil-id); }
    .gb-gold   { --rod: var(--gold-od); --rol: var(--gold-ol); --rmid: var(--gold-mid); --ril: var(--gold-il); --rid: var(--gold-id); }
    /* Highlight frames get slightly roomier plates */
    .highlight-actions .gb-inner { padding: 0.6rem 1.5rem; font-size: 0.82rem; }

    /* --- FEATURED FRAMES: scooped gilded picture frames --- */
    .projects-wrap[data-cols]:not([data-cols="1"]) .project-card.highlight {
      grid-column: span 2;
    }
    .project-card.highlight {
      --r: 16px;
      --t-out: 1px;
      --t-mid: 3px;
      --t-in: 1px;
      --sr: var(--r);
      padding: 5px;
      background: linear-gradient(to top right, var(--gold-od) 45%, var(--gold-ol) 55%);
      /* drop-shadow follows the scooped silhouette (box-shadow would be masked away) */
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.42));
      transition: transform var(--transition), filter var(--transition);
    }
    .project-card.highlight::before {
      inset: var(--t-out);
      background: var(--gold-mid);
      background-image: none;
      clip-path: none;
      filter: none;
      box-shadow: none;
      opacity: 1;
      mix-blend-mode: normal;
      --so: calc(-1 * var(--t-out));
      --sor: calc(100% + var(--t-out));
      --sr: calc(var(--r) + var(--t-out));
    }
    .project-card.highlight::after {
      inset: calc(var(--t-out) + var(--t-mid));
      background: linear-gradient(to top right, var(--gold-il) 45%, var(--gold-id) 55%);
      clip-path: none;
      box-shadow: none;
      opacity: 1;
      mix-blend-mode: normal;
      --so: calc(-1 * (var(--t-out) + var(--t-mid)));
      --sor: calc(100% + var(--t-out) + var(--t-mid));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid));
    }
    .highlight-surface {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: var(--paper-light);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.28);
      min-height: 100%;
      --so: calc(-1 * (var(--t-out) + var(--t-mid) + var(--t-in)));
      --sor: calc(100% + var(--t-out) + var(--t-mid) + var(--t-in));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid) + var(--t-in));
    }
    .highlight-media {
      position: relative;
      flex: 0 0 44%;
      min-height: 210px;
      overflow: hidden;
      background: linear-gradient(120deg, #3a352c, #57503f);
    }
    .highlight-media::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset -14px 0 20px -14px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .highlight-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s cubic-bezier(0.2, 0.6, 0.2, 1);
    }
    .highlight-media > i {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(240,231,211,0.85);
    }
    .highlight-body {
      position: relative;
      flex: 1;
      min-width: 0;
      padding: 1.6rem 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .highlight-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/paper-texture.jpg');
      background-size: 642px 642px;
      mix-blend-mode: multiply;
      opacity: 0.33;
      box-shadow: inset 0 0 60px rgba(54,41,22,0.22);
      pointer-events: none;
    }
    .highlight-body > * { position: relative; z-index: 1; }
    .highlight-top {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.55rem;
    }
    .highlight-top > i {
      font-size: 1.8rem;
      color: var(--ink);
      flex-shrink: 0;
    }
    .highlight-body h3 {
      font-family: var(--font-head);
      font-size: 1.42rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1.15;
    }
    .highlight-body .type-label {
      font-family: var(--font-head);
      font-size: 0.72rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 0.2rem;
    }
    .highlight-body p.desc {
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.4;
    }
    .highlight-body .award {
      font-family: var(--font-head);
      font-size: 0.7rem;
      color: #fff;
      letter-spacing: 0.6px;
      margin-top: 0.9rem;
      padding: 0.35rem 0.8rem;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      box-shadow: 0 2px 7px rgba(154,122,51,0.5), inset 0 1px 1px rgba(255,255,255,0.45);
      align-self: flex-start;
      display: inline-block;
    }
    .highlight-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.1rem;
    }
    .projects-wrap[data-cols="1"] .project-card.highlight .highlight-surface {
      flex-direction: column;
    }
    .projects-wrap[data-cols="1"] .highlight-media {
      flex: none;
      aspect-ratio: 16 / 8.5;
      min-height: 170px;
    }
    .projects-wrap[data-cols="1"] .highlight-media::after {
      box-shadow: inset 0 -14px 20px -14px rgba(0,0,0,0.5);
    }
    
    .version-number {
      position: fixed;
      top: 10px;
      right: 12px;
      font-size: 10px;
      font-family: var(--font-head);
      color: rgba(240,231,211,0.4);
      z-index: 1000;
    }

    /* --- NATIVE VIEW TRANSITIONS --- */
    header {
      view-transition-name: main-header;
    }

    .profile-photo {
      view-transition-name: profile-photo;
    }

    #content {
      view-transition-name: page-content;
    }

    ::view-transition-old(page-content) {
      animation: fade-out 0.2s cubic-bezier(0.4, 0, 1, 1) both;
    }

    ::view-transition-new(page-content) {
      animation: slide-up 0.4s cubic-bezier(0, 0, 0.2, 1) both;
    }

    @keyframes fade-out {
      to { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- ARCHIVE --- */
    .archive-footer {
      text-align: center;
      padding: 2.4rem 1rem 4rem;
    }
    .archive-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,13,10,0.62);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 2000;
    }
    .archive-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .archive-modal {
      --r: 16px;
      --t-out: 1px;
      --t-mid: 3px;
      --t-in: 1px;
      --sr: var(--r);
      position: relative;
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      padding: 5px;
      background: linear-gradient(to top right, var(--sil-od) 45%, var(--sil-ol) 55%);
      filter: drop-shadow(0 24px 50px rgba(0,0,0,0.55));
      transform: translateY(20px) scale(0.98);
      transition: transform var(--transition);
    }
    .archive-modal::before {
      content: '';
      position: absolute;
      inset: var(--t-out);
      background: var(--sil-mid);
      --so: calc(-1 * var(--t-out));
      --sor: calc(100% + var(--t-out));
      --sr: calc(var(--r) + var(--t-out));
    }
    .archive-modal::after {
      content: '';
      position: absolute;
      inset: calc(var(--t-out) + var(--t-mid));
      background: linear-gradient(to top right, var(--sil-il) 45%, var(--sil-id) 55%);
      --so: calc(-1 * (var(--t-out) + var(--t-mid)));
      --sor: calc(100% + var(--t-out) + var(--t-mid));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid));
    }
    .archive-overlay.open .archive-modal {
      transform: translateY(0) scale(1);
    }
    .archive-surface {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      max-height: calc(85vh - 10px);
      overflow: hidden;
      background: var(--paper);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.28);
      --so: calc(-1 * (var(--t-out) + var(--t-mid) + var(--t-in)));
      --sor: calc(100% + var(--t-out) + var(--t-mid) + var(--t-in));
      --sr: calc(var(--r) + var(--t-out) + var(--t-mid) + var(--t-in));
    }
    .archive-modal-header {
      position: relative;
      background: #575043;
      color: var(--cream);
      padding: 1.15rem 1.4rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: inset 0 -3px 8px rgba(0,0,0,0.3);
    }
    .archive-modal-header::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/paper-texture.jpg');
      background-size: 642px 642px;
      mix-blend-mode: multiply;
      opacity: 0.35;
      pointer-events: none;
    }
    .archive-modal-header h2 {
      position: relative;
      font-family: var(--font-head);
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .archive-modal-header .archive-sub {
      position: relative;
      font-family: var(--font-head);
      font-size: 0.72rem;
      letter-spacing: 1px;
      opacity: 0.75;
      margin-top: 0.3rem;
    }
    .archive-close {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.12);
      border: none;
      color: var(--cream);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition);
    }
    .archive-close:hover { background: rgba(255,255,255,0.28); }
    .archive-body {
      position: relative;
      padding: 0.6rem 1.3rem 1.4rem;
      overflow-y: auto;
      background: var(--paper);
    }
    .archive-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/paper-texture.jpg');
      background-size: 642px 642px;
      mix-blend-mode: multiply;
      opacity: 0.4;
      pointer-events: none;
    }
    .archive-body > * { position: relative; }
    .archive-folder { border-bottom: 1px solid rgba(26,26,26,0.18); }
    .archive-folder:last-child { border-bottom: none; }
    .archive-folder > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 0.25rem;
      font-family: var(--font-head);
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: var(--ink);
    }
    .archive-folder > summary::-webkit-details-marker { display: none; }
    .archive-folder > summary .folder-icon {
      color: var(--gold);
      width: 1.2rem;
      text-align: center;
    }
    .archive-folder > summary .folder-desc {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .archive-folder > summary .chevron {
      margin-left: auto;
      color: var(--gold);
      font-size: 0.8rem;
      transition: transform var(--transition);
    }
    .archive-folder[open] > summary .chevron { transform: rotate(90deg); }
    .archive-children { padding-left: 1.6rem; padding-bottom: 0.5rem; }
    .archive-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem;
      border-radius: 6px;
      color: var(--ink);
      transition: background var(--transition);
    }
    .archive-link:hover { background: rgba(154,122,51,0.16); }
    .archive-link .link-text { display: flex; flex-direction: column; min-width: 0; }
    .archive-link .link-name { font-family: var(--font-head); font-size: 0.9rem; letter-spacing: 0.6px; }
    .archive-link .link-desc { font-size: 0.85rem; font-style: italic; color: var(--muted); }
    .archive-link .ext-icon {
      margin-left: auto;
      color: var(--gold);
      font-size: 0.8rem;
      opacity: 0.75;
    }

    /* --- COLLAPSIBLE SECTIONS (fade + show more) --- */
    .projects-wrap {
      position: relative;
      clip-path: inset(-40px);
      transition: max-height 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .projects-wrap.collapsed {
      clip-path: inset(-40px -40px 0px -40px);
      /* Scroll-shadow fade (WolffsPoint-style): the peeked content itself
         dissolves to transparent instead of being covered by an overlay */
      -webkit-mask-image: linear-gradient(to bottom,
        black calc(100% - var(--peek, 92px)),
        rgba(0,0,0,0.45) calc(100% - var(--peek, 92px) / 2),
        transparent 100%);
      mask-image: linear-gradient(to bottom,
        black calc(100% - var(--peek, 92px)),
        rgba(0,0,0,0.45) calc(100% - var(--peek, 92px) / 2),
        transparent 100%);
    }
    .projects-wrap.collapsed .beyond-fold {
      pointer-events: none;
    }
    .projects-wrap.just-expanded .beyond-fold {
      animation: card-in 0.5s cubic-bezier(0, 0, 0.2, 1) backwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px); }
    }
    .section-toggle {
      position: relative;
      z-index: 7;
      display: none;
      text-align: center;
      margin-top: 0.9rem;
    }
    .projects-wrap.collapsible + .section-toggle {
      display: block;
    }
    .projects-wrap.collapsed + .section-toggle {
      margin-top: -40px;
    }
    .show-more-btn .gb-inner {
      padding: 0.55rem 1.4rem;
      font-size: 0.8rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .show-more-btn i {
      font-size: 0.7rem;
      transition: transform var(--transition);
    }
    .projects-wrap.expanded + .section-toggle .show-more-btn i {
      transform: rotate(180deg);
    }

    /* --- VIEW SWAPPING: only the sheet's contents change --- */
    #view-projects[hidden], #view-about[hidden] { display: none; }
    .sheet.morphing {
      overflow: hidden;
      transition: height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- ABOUT VIEW: resume clippings pinned to the sheet --- */
    #view-about {
      display: grid;
      grid-template-columns: 1.85fr 1fr;
      gap: 1.9rem;
      align-items: start;
    }
    @media (max-width: 860px) {
      #view-about { grid-template-columns: 1fr; }
    }
    .about-main, .about-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.9rem;
      min-width: 0;
    }
    .clip {
      position: relative;
      padding: 1.5rem 1.5rem 1.7rem;
    }
    .clip::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--paper-light);
      clip-path: var(--tear);
      filter: drop-shadow(0 7px 15px rgba(30,25,15,0.32));
      z-index: 0;
    }
    .clip::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url('assets/paper-texture.jpg'),
        radial-gradient(ellipse 150% 130% at 50% 50%, transparent 58%, rgba(74,55,30,0.42) 100%);
      background-repeat: repeat, no-repeat;
      background-size: 642px 642px, 100% 100%;
      mix-blend-mode: multiply;
      opacity: 0.38;
      clip-path: var(--tear);
      pointer-events: none;
      z-index: 0;
    }
    .clip > * {
      position: relative;
      z-index: 1;
    }
    .clip h3 {
      font-family: var(--font-head);
      font-size: 1.18rem;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.7rem;
      padding-bottom: 0.45rem;
      border-bottom: 3px double rgba(26,26,26,0.4);
    }
    .clip p {
      font-size: 1.05rem;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .item-title {
      font-family: var(--font-head);
      font-size: 0.98rem;
      letter-spacing: 0.5px;
      color: var(--ink);
      margin-bottom: 0;
      line-height: 1.4;
    }
    .item-date {
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 0.1rem;
      margin-bottom: 0.35rem;
      color: var(--gold);
    }
    .item-desc {
      font-size: 1rem;
      margin-bottom: 0.4rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }
    .item-block + .item-block {
      margin-top: 1.3rem;
      padding-top: 1rem;
      border-top: 1px dashed rgba(26,26,26,0.3);
    }
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      align-items: stretch;
    }
    .contact-list .gb { display: block; }
    .contact-list .gb-inner {
      justify-content: flex-start;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      white-space: normal;
      word-break: break-word;
    }
    .contact-list .gb-inner i { flex-shrink: 0; }

    /* --- SMALL DESKS --- */
    @media (max-width: 700px) {
      header { padding: 2.6rem 1rem 2rem; }
      .name-script { font-size: 2.7rem; }
      .profile-photo { width: 62px; height: 62px; }
      .moon { width: 140px; height: 140px; top: -30px; right: 4%; }
      .container { padding: 0 0.6rem; }
      .sheet { padding: 2.2rem 1.1rem 3.4rem; }
      .ftab-in { padding: 0.7rem 1rem 0.8rem; font-size: 0.68rem; letter-spacing: 1.2px; }
      .projects-section h2 { font-size: 1.15rem; }
      .highlight-body { padding: 1.3rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .projects-wrap,
      .show-fade,
      .show-more-btn i,
      .gb,
      .ftab,
      .highlight-img,
      .card-photo {
        transition: none;
      }
      .projects-wrap.just-expanded .beyond-fold {
        animation: none;
      }
    }
    </style>
</head>
<body>
  <div class="version-number" id="version">v2.2</div>

  <header>
    <div class="moon"></div>
    <h1 id="site-title">
      <img src="goated-photo.jpg" alt="Malachy Fernandez" class="profile-photo">
      <span class="name-script">Malachy Fernandez</span>
    </h1>
    <div class="header-sub">Project Showcase</div>
  </header>

  <div class="container">
    <nav class="tab-row" id="navigation"></nav>
    <div class="sheet-wrap">
      <div class="sheet-shadow"></div>
      <div class="sheet" id="sheet">
        <div id="content">
          <div id="view-projects">
            <!-- Project sections will be populated by JavaScript -->
          </div>
          <div id="view-about" hidden>
            <!-- About Me content will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="config/site.js"></script>
  <script src="config/projects.js"></script>
  <script src="config/archive.js"></script>
  <script src="config/about.js"></script>
  <script>
    // Apply configuration to the page
    function initializeSite() {
      // Set page title and site title
      document.getElementById('page-title').textContent = siteConfig.site.title;

      // Build navigation — folder tabs that swap the sheet's contents in place
      const navContainer = document.getElementById('navigation');
      const VIEW_FOR_LINK = { 'index.html': 'projects', 'AboutMe/index.html': 'about' };
      siteConfig.navigation.forEach(item => {
        const view = VIEW_FOR_LINK[item.link] || 'projects';
        const tab = document.createElement('a');
        tab.className = 'ftab' + (item.active ? ' active' : '');
        tab.dataset.view = view;
        tab.href = '#' + view;

        const inner = document.createElement('span');
        inner.className = 'ftab-in';
        const icon = document.createElement('i');
        icon.className = item.icon || 'fas fa-folder';
        inner.appendChild(icon);
        inner.appendChild(document.createTextNode(item.text));
        tab.appendChild(inner);
        tab.addEventListener('click', e => {
          e.preventDefault();
          showView(view);
        });
        navContainer.appendChild(tab);
      });

      // Build project sections from project config
      const contentContainer = document.getElementById('view-projects');
      projectShowcaseConfig.sections.forEach(section => {
        const sectionElement = document.createElement('section');
        sectionElement.className = 'projects-section';

        // Section title
        const titleElement = document.createElement('h2');
        titleElement.textContent = section.title;
        sectionElement.appendChild(titleElement);

        // Section subtext
        const subtextElement = document.createElement('p');
        subtextElement.className = 'section-subtext';
        subtextElement.textContent = section.subtext;
        sectionElement.appendChild(subtextElement);

        // Projects grid
        const projectsGrid = document.createElement('div');
        projectsGrid.className = 'projects';

        // GitHub gets a silver plate; live/demo/store links get gold.
        // Match the github.com host or the fa-github icon — live links on
        // *.github.io must NOT count as GitHub.
        const isGithubLink = (link, icon) => {
          if (/fa-github/.test(icon || '')) return true;
          try { return /(^|\.)github\.com$/.test(new URL(link).hostname); }
          catch { return false; }
        };
        const buildButtons = (project, container) => {
          project.buttons.forEach(button => {
            const isGithub = isGithubLink(button.link, button.icon);
            const link = document.createElement('a');
            link.href = button.link;
            link.target = button.target || '_blank';
            link.className = 'gb ' + (isGithub ? 'gb-silver' : 'gb-gold');

            const frame = document.createElement('span');
            frame.className = 'gb-frame';
            const inner = document.createElement('span');
            inner.className = 'gb-inner';
            const icon = document.createElement('i');
            icon.className = button.icon;
            inner.appendChild(icon);
            inner.appendChild(document.createTextNode(button.text));
            frame.appendChild(inner);
            link.appendChild(frame);
            container.appendChild(link);
          });
        };

        let clipIndex = 0;
        section.projects.forEach(project => {
          const card = document.createElement('div');
          card.className = 'project-card' + (project.highlight ? ' highlight' : '');

          if (project.highlight) {
            // Gilded picture frame — crisp cover photo + always-visible actions
            const surface = document.createElement('div');
            surface.className = 'highlight-surface';

            const media = document.createElement('div');
            media.className = 'highlight-media';
            if (project.backgroundImage) {
              const img = document.createElement('div');
              img.className = 'highlight-img';
              img.style.backgroundImage = `url('${project.backgroundImage}')`;
              media.appendChild(img);
            } else {
              const mediaIcon = document.createElement('i');
              mediaIcon.className = project.icon;
              media.appendChild(mediaIcon);
            }
            surface.appendChild(media);

            const body = document.createElement('div');
            body.className = 'highlight-body';

            const top = document.createElement('div');
            top.className = 'highlight-top';
            const topIcon = document.createElement('i');
            topIcon.className = project.icon;
            top.appendChild(topIcon);
            const titleWrap = document.createElement('div');
            const name = document.createElement('h3');
            name.textContent = project.name;
            const typeLabel = document.createElement('div');
            typeLabel.className = 'type-label';
            typeLabel.textContent = project.type;
            titleWrap.appendChild(name);
            titleWrap.appendChild(typeLabel);
            top.appendChild(titleWrap);
            body.appendChild(top);

            const desc = document.createElement('p');
            desc.className = 'desc';
            desc.textContent = project.description;
            body.appendChild(desc);

            if (project.award) {
              const award = document.createElement('div');
              award.className = 'award';
              award.textContent = project.award;
              body.appendChild(award);
            }

            const actions = document.createElement('div');
            actions.className = 'highlight-actions';
            buildButtons(project, actions);
            body.appendChild(actions);
            surface.appendChild(body);
            card.appendChild(surface);
          } else {
            // Torn newspaper clipping — sepia photo + typewriter text
            card.style.setProperty('--tear', CLIP_VARIANTS[clipIndex++ % CLIP_VARIANTS.length]);

            const cardContent = document.createElement('div');
            cardContent.className = 'card-content';

            if (project.backgroundImage) {
              const photo = document.createElement('div');
              photo.className = 'card-photo';
              const photoImg = document.createElement('div');
              photoImg.className = 'card-photo-img';
              photoImg.style.backgroundImage = `url('${project.backgroundImage}')`;
              photo.appendChild(photoImg);
              cardContent.appendChild(photo);
            } else {
              const icon = document.createElement('i');
              icon.className = project.icon + ' card-icon';
              cardContent.appendChild(icon);
            }

            // Project name
            const name = document.createElement('h3');
            name.textContent = project.name;
            cardContent.appendChild(name);

            // Type label
            const typeLabel = document.createElement('div');
            typeLabel.className = 'type-label';
            typeLabel.textContent = project.type;
            cardContent.appendChild(typeLabel);

            // Description
            const desc = document.createElement('p');
            desc.className = 'desc';
            desc.textContent = project.description;
            cardContent.appendChild(desc);

            // Award (if exists)
            if (project.award) {
              const award = document.createElement('div');
              award.className = 'award';
              award.textContent = project.award;
              cardContent.appendChild(award);
            }

            card.appendChild(cardContent);

            // Card actions
            const cardActions = document.createElement('div');
            cardActions.className = 'card-actions';
            buildButtons(project, cardActions);
            card.appendChild(cardActions);
          }

          projectsGrid.appendChild(card);

          // Add click listener for mobile toggle
          card.addEventListener('click', function(e) {
            // Don't toggle if clicking on a button link
            if (e.target.closest('a')) return;
            // Highlight cards always show their buttons — nothing to toggle
            if (this.classList.contains('highlight')) return;
            this.classList.toggle('touch-active');
            document.querySelectorAll('.project-card').forEach(c => {
              if (c !== this) c.classList.remove('touch-active');
            });
          });
        });

        // Wrap the grid so extra rows can fade out behind a "show more" toggle
        const wrap = document.createElement('div');
        wrap.className = 'projects-wrap';
        wrap.appendChild(projectsGrid);
        sectionElement.appendChild(wrap);

        const toggle = document.createElement('div');
        toggle.className = 'section-toggle';
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'gb gb-silver show-more-btn';
        const toggleFrame = document.createElement('span');
        toggleFrame.className = 'gb-frame';
        const toggleInner = document.createElement('span');
        toggleInner.className = 'gb-inner';
        const toggleLabel = document.createElement('span');
        toggleLabel.className = 'label';
        toggleLabel.textContent = 'Show more';
        const toggleChevron = document.createElement('i');
        toggleChevron.className = 'fas fa-chevron-down';
        toggleInner.appendChild(toggleLabel);
        toggleInner.appendChild(toggleChevron);
        toggleFrame.appendChild(toggleInner);
        toggleBtn.appendChild(toggleFrame);
        toggle.appendChild(toggleBtn);
        toggleBtn.addEventListener('click', () => toggleSection(wrap, sectionElement));
        sectionElement.appendChild(toggle);

        contentContainer.appendChild(sectionElement);
      });
    }

    // --- About Me view: same sheet, different page of the folder ---
    let clipIndexAbout = 0;
    const nextClip = () => CLIP_VARIANTS[clipIndexAbout++ % CLIP_VARIANTS.length];

    // One gilded plate — silver for GitHub, gold otherwise
    function gildedLink(href, icon, text, target) {
      let isGithub = /fa-github/.test(icon || '');
      try { isGithub = isGithub || /(^|\.)github\.com$/.test(new URL(href).hostname); }
      catch { /* relative link — not github */ }
      const link = document.createElement('a');
      link.href = href;
      if (target) link.target = target;
      link.className = 'gb ' + (isGithub ? 'gb-silver' : 'gb-gold');
      const frame = document.createElement('span');
      frame.className = 'gb-frame';
      const inner = document.createElement('span');
      inner.className = 'gb-inner';
      const i = document.createElement('i');
      i.className = icon;
      inner.appendChild(i);
      inner.appendChild(document.createTextNode(text));
      frame.appendChild(inner);
      link.appendChild(frame);
      return link;
    }

    function initializeAboutView() {
      if (typeof aboutMeConfig === 'undefined') return;
      const view = document.getElementById('view-about');
      const mainColumn = document.createElement('div');
      mainColumn.className = 'about-main';
      const sidebar = document.createElement('div');
      sidebar.className = 'about-sidebar';

      aboutMeConfig.sections.forEach(section => {
        const clip = document.createElement('div');
        clip.className = 'clip';
        clip.style.setProperty('--tear', nextClip());

        const title = document.createElement('h3');
        title.textContent = section.title;
        clip.appendChild(title);

        if (section.content) {
          const p = document.createElement('p');
          p.textContent = section.content;
          clip.appendChild(p);
        } else if (section.items) {
          section.items.forEach(item => {
            const block = document.createElement('div');
            block.className = 'item-block';
            const t = document.createElement('p');
            t.className = 'item-title';
            t.innerHTML = `<strong>${item.title}</strong>`;
            block.appendChild(t);
            if (item.date) {
              const d = document.createElement('p');
              d.className = 'item-date';
              d.innerHTML = `<em>${item.date}</em>`;
              block.appendChild(d);
            }
            item.descriptions.forEach(desc => {
              const p = document.createElement('p');
              p.className = 'item-desc';
              p.textContent = desc;
              block.appendChild(p);
            });
            clip.appendChild(block);
          });
        }
        mainColumn.appendChild(clip);
      });

      const sidebarDefs = [
        ['Contact', clip => {
          const list = document.createElement('div');
          list.className = 'contact-list';
          aboutMeConfig.sidebar.contact.forEach(c =>
            list.appendChild(gildedLink(c.link, c.icon, c.text, c.target)));
          clip.appendChild(list);
        }],
        ['Education', clip => {
          aboutMeConfig.sidebar.education.forEach(edu => {
            const block = document.createElement('div');
            block.className = 'item-block';
            const t = document.createElement('p');
            t.className = 'item-title';
            t.innerHTML = `<strong>${edu.school}</strong>`;
            const d = document.createElement('p');
            d.className = 'item-date';
            d.innerHTML = `<em>${edu.years}</em>`;
            block.appendChild(t);
            block.appendChild(d);
            clip.appendChild(block);
          });
        }],
        ['Skills', clip => {
          aboutMeConfig.sidebar.skills.forEach(skill => {
            const block = document.createElement('div');
            block.className = 'item-block';
            const t = document.createElement('p');
            t.className = 'item-title';
            t.innerHTML = `<strong>${skill.category}</strong>`;
            const d = document.createElement('p');
            d.className = 'item-desc';
            d.textContent = skill.items.join(', ');
            block.appendChild(t);
            block.appendChild(d);
            clip.appendChild(block);
          });
        }],
      ];
      sidebarDefs.forEach(([title, fill]) => {
        const clip = document.createElement('div');
        clip.className = 'clip';
        clip.style.setProperty('--tear', nextClip());
        const h = document.createElement('h3');
        h.textContent = title;
        clip.appendChild(h);
        fill(clip);
        sidebar.appendChild(clip);
      });

      view.appendChild(mainColumn);
      view.appendChild(sidebar);
    }

    // --- View swapping: the desk stays put, only the sheet's page changes ---
    const VIEW_TITLES = { projects: 'Project Showcase', about: 'About Me' };

    function showView(view, animate = true) {
      const projectsView = document.getElementById('view-projects');
      const aboutView = document.getElementById('view-about');
      const showAbout = view === 'about';
      if (!(showAbout ? aboutView : projectsView).hidden) return; // already there
      history.replaceState(null, '', '#' + view);

      const swap = () => {
        projectsView.hidden = showAbout;
        aboutView.hidden = !showAbout;
        document.querySelectorAll('.ftab').forEach(t =>
          t.classList.toggle('active', t.dataset.view === view));
        document.querySelector('.header-sub').textContent = VIEW_TITLES[view];
        document.title = showAbout ? aboutMeConfig.title : siteConfig.site.title;
        // Projects need a fresh row measurement once they're visible again
        if (!showAbout) layoutSections();
      };

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animate || reduced || !document.startViewTransition) {
        swap();
        return;
      }

      // Morph the sheet's height around the crossfade
      const sheet = document.getElementById('sheet');
      const oldH = sheet.offsetHeight;
      sheet.style.height = oldH + 'px';
      sheet.classList.add('morphing');
      const release = () => { sheet.style.height = ''; sheet.classList.remove('morphing'); };

      document.startViewTransition(swap);
      requestAnimationFrame(() => {
        const newH = sheet.scrollHeight;
        if (newH !== oldH) {
          sheet.style.height = newH + 'px';
          sheet.addEventListener('transitionend', function te(e) {
            if (e.propertyName === 'height') {
              sheet.removeEventListener('transitionend', te);
              release();
            }
          });
          setTimeout(release, 800);
        } else {
          release();
        }
      });
    }

    window.addEventListener('hashchange', () => {
      const view = location.hash === '#about' ? 'about' : 'projects';
      showView(view);
    });

    // --- Torn paper edges: deterministic jagged clip-paths ---
    // Mostly shallow nicks with occasional deeper tears, like real ripped
    // paper. Points along edges are %, jag depth is px, so a clip generated
    // for one size scales cleanly to any size.
    function buildTornClipPath(width, height, seedStart, topDepthScale = 1) {
      let seed = seedStart;
      const rand = () => {
        seed = (seed * 48271) % 2147483647;
        return seed / 2147483647;
      };
      const depth = () => (rand() < 0.15 ? 4 + rand() * 5 : rand() * 4.5);
      const jag = () => `${(depth()).toFixed(1)}px`;
      const jagTop = () => `${(depth() * topDepthScale).toFixed(1)}px`;
      const jagFromFar = () => `calc(100% - ${depth().toFixed(1)}px)`;
      const PX_PER_POINT = 7;
      const edgePoints = (length) => {
        const count = Math.max(4, Math.round(length / PX_PER_POINT));
        const points = [];
        for (let i = 0; i <= count; i++) {
          const jitter = i === 0 || i === count ? 0 : (rand() - 0.5) * (0.8 / count);
          points.push(Math.min(1, Math.max(0, i / count + jitter)));
        }
        return points;
      };
      const xs = edgePoints(width);
      const ys = edgePoints(height);
      const pct = (f) => `${(f * 100).toFixed(2)}%`;
      const pts = [];
      xs.forEach((x) => pts.push(`${pct(x)} ${jagTop()}`));
      ys.slice(1).forEach((y) => pts.push(`${jagFromFar()} ${pct(y)}`));
      [...xs].reverse().slice(1).forEach((x) => pts.push(`${pct(x)} ${jagFromFar()}`));
      [...ys].reverse().slice(1, -1).forEach((y) => pts.push(`${jag()} ${pct(y)}`));
      return `polygon(${pts.join(', ')})`;
    }
    const CLIP_VARIANTS = [11, 37, 53, 71, 89, 103].map(s => buildTornClipPath(420, 260, s));

    // --- Collapsible sections: show 2 rows, fade out the rest ---
    const PEEK_PX = 92;
    const CARD_MIN = 340; // must match minmax() in the .projects grid CSS

    function layoutSections() {
      document.querySelectorAll('.projects-wrap').forEach(wrap => {
        const grid = wrap.querySelector('.projects');
        const cards = Array.from(grid.querySelectorAll('.project-card'));
        if (!cards.length) return;

        // How many columns does the grid have room for? Derived from width
        // rather than computed tracks, since span-2 highlights can create
        // implicit tracks and skew the count.
        const gap = parseFloat(getComputedStyle(grid).columnGap) || 0;
        const cols = Math.max(1, Math.floor((grid.clientWidth + gap) / (CARD_MIN + gap)));
        wrap.dataset.cols = cols;

        // Order cards: on 3-col screens stagger highlights left/right so a
        // single card sits beside each one; on narrower screens stack the
        // highlights first so they own the first two rows.
        const highs = cards.filter(c => c.classList.contains('highlight'));
        const rest = cards.filter(c => !c.classList.contains('highlight'));
        let seq;
        if (cols >= 3 && highs.length) {
          seq = [];
          let ri = 0;
          const fill = cols - 2; // singles that share a row with a highlight
          highs.forEach((h, i) => {
            if (i % 2 === 1) { seq.push(...rest.slice(ri, ri + fill)); ri += fill; }
            seq.push(h);
            if (i % 2 === 0) { seq.push(...rest.slice(ri, ri + fill)); ri += fill; }
          });
          seq.push(...rest.slice(ri));
        } else {
          seq = highs.concat(rest);
        }
        seq.forEach((c, i) => { c.style.order = i; });

        // Measure the visual rows the cards landed on
        const tops = [...new Set(cards.map(c => c.offsetTop))].sort((a, b) => a - b);
        const collapsible = tops.length > 2;
        wrap.classList.toggle('collapsible', collapsible);
        cards.forEach(c => c.classList.remove('beyond-fold'));
        if (!collapsible) {
          wrap.classList.remove('collapsed', 'expanded');
          wrap.style.maxHeight = 'none';
          return;
        }

        const foldTop = tops[2];
        const beyond = cards.filter(c => c.offsetTop >= foldTop - 1);
        beyond.forEach((c, i) => {
          c.classList.add('beyond-fold');
          c.style.setProperty('--d', Math.min(i * 70, 350) + 'ms');
        });
        wrap.dataset.fold = foldTop;
        wrap.dataset.hiddenCount = beyond.length;
        // The mask fade starts at the fold and dissolves across the peek
        wrap.style.setProperty('--peek', PEEK_PX + 'px');

        const expanded = wrap.classList.contains('expanded');
        wrap.classList.toggle('collapsed', !expanded);
        wrap.style.maxHeight = expanded
          ? grid.offsetHeight + 'px'
          : (foldTop + PEEK_PX) + 'px';
        updateToggleLabel(wrap);
      });
    }

    function updateToggleLabel(wrap) {
      const label = wrap.parentElement.querySelector('.section-toggle .label');
      if (!label) return;
      label.textContent = wrap.classList.contains('expanded')
        ? 'Show less'
        : 'Show ' + (wrap.dataset.hiddenCount || '') + ' more';
    }

    function toggleSection(wrap, sectionEl) {
      const grid = wrap.querySelector('.projects');
      const expanded = wrap.classList.toggle('expanded');
      wrap.classList.toggle('collapsed', !expanded);
      if (expanded) {
        wrap.style.maxHeight = grid.offsetHeight + 'px';
        wrap.classList.add('just-expanded');
        setTimeout(() => wrap.classList.remove('just-expanded'), 900);
      } else {
        wrap.style.maxHeight = (parseFloat(wrap.dataset.fold) + PEEK_PX) + 'px';
        // If the fold is above the viewport, bring the section back into view
        if (wrap.getBoundingClientRect().top < -20) {
          sectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
      updateToggleLabel(wrap);
    }

    // Build a single archive tree node (folder if it has children, else a link)
    function buildArchiveNode(node) {
      if (node.children) {
        const details = document.createElement('details');
        details.className = 'archive-folder';

        const summary = document.createElement('summary');
        if (node.icon) {
          const folderIcon = document.createElement('i');
          folderIcon.className = node.icon + ' folder-icon';
          summary.appendChild(folderIcon);
        }
        const label = document.createElement('span');
        label.textContent = node.name;
        summary.appendChild(label);
        if (node.description) {
          const folderDesc = document.createElement('span');
          folderDesc.className = 'folder-desc';
          folderDesc.textContent = '· ' + node.description;
          summary.appendChild(folderDesc);
        }
        const chevron = document.createElement('i');
        chevron.className = 'fas fa-chevron-right chevron';
        summary.appendChild(chevron);
        details.appendChild(summary);

        const children = document.createElement('div');
        children.className = 'archive-children';
        node.children.forEach(child => children.appendChild(buildArchiveNode(child)));
        details.appendChild(children);
        return details;
      }

      const link = document.createElement('a');
      link.className = 'archive-link';
      link.href = node.link;
      link.target = '_blank';

      const text = document.createElement('span');
      text.className = 'link-text';
      const name = document.createElement('span');
      name.className = 'link-name';
      name.textContent = node.name;
      text.appendChild(name);
      if (node.description) {
        const desc = document.createElement('span');
        desc.className = 'link-desc';
        desc.textContent = node.description;
        text.appendChild(desc);
      }
      link.appendChild(text);

      const extIcon = document.createElement('i');
      extIcon.className = 'fas fa-external-link-alt ext-icon';
      link.appendChild(extIcon);
      return link;
    }

    // Append the archive button + modal to the bottom of the page
    function renderArchive() {
      if (typeof archiveConfig === 'undefined') return;

      const footer = document.createElement('div');
      footer.className = 'archive-footer';
      const openBtn = document.createElement('button');
      openBtn.className = 'gb gb-gold archive-btn';
      const openFrame = document.createElement('span');
      openFrame.className = 'gb-frame';
      const openInner = document.createElement('span');
      openInner.className = 'gb-inner';
      openInner.style.padding = '0.7rem 1.6rem';
      openInner.style.fontSize = '0.85rem';
      openInner.style.letterSpacing = '1.5px';
      const btnIcon = document.createElement('i');
      btnIcon.className = 'fas fa-archive';
      openInner.appendChild(btnIcon);
      openInner.appendChild(document.createTextNode(archiveConfig.title.toUpperCase()));
      openFrame.appendChild(openInner);
      openBtn.appendChild(openFrame);
      footer.appendChild(openBtn);
      document.body.appendChild(footer);

      const overlay = document.createElement('div');
      overlay.className = 'archive-overlay';

      const modal = document.createElement('div');
      modal.className = 'archive-modal';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      modal.setAttribute('aria-label', archiveConfig.title);

      const modalHeader = document.createElement('div');
      modalHeader.className = 'archive-modal-header';
      const headingWrap = document.createElement('div');
      const heading = document.createElement('h2');
      heading.textContent = archiveConfig.title;
      headingWrap.appendChild(heading);
      if (archiveConfig.subtext) {
        const sub = document.createElement('div');
        sub.className = 'archive-sub';
        sub.textContent = archiveConfig.subtext;
        headingWrap.appendChild(sub);
      }
      modalHeader.appendChild(headingWrap);
      const closeBtn = document.createElement('button');
      closeBtn.className = 'archive-close';
      closeBtn.setAttribute('aria-label', 'Close');
      closeBtn.innerHTML = '&times;';
      modalHeader.appendChild(closeBtn);

      const surface = document.createElement('div');
      surface.className = 'archive-surface';
      surface.appendChild(modalHeader);

      const body = document.createElement('div');
      body.className = 'archive-body';
      archiveConfig.tree.forEach(node => body.appendChild(buildArchiveNode(node)));
      surface.appendChild(body);
      modal.appendChild(surface);

      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      const open = () => overlay.classList.add('open');
      const close = () => overlay.classList.remove('open');
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') close();
      });
    }

    // Initialize the site immediately so View Transition can see it
    initializeSite();
    initializeAboutView();
    if (location.hash === '#about') showView('about', false);

    // Tear the big sheet — gentler on top where the folder tabs attach.
    // The polygon's edge points are % positions, so a frozen clip-path
    // stretches gracefully when the sheet's height changes (view swaps,
    // show-more expansion). Only regenerate when the WIDTH meaningfully
    // changes, debounced — otherwise the tear reshuffles every frame and
    // the edges jitter.
    const sheet = document.getElementById('sheet');
    let lastTearWidth = 0;
    let tearTimer;
    const setSheetTear = (force) => {
      const w = Math.round(sheet.offsetWidth / 24) * 24;
      if (!force && w === lastTearWidth) return;
      lastTearWidth = w;
      sheet.style.setProperty('--tear', buildTornClipPath(w, sheet.offsetHeight, 7, 0.25));
    };
    setSheetTear(true);
    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        clearTimeout(tearTimer);
        tearTimer = setTimeout(() => setSheetTear(), 150);
      }).observe(sheet);
    }

    layoutSections();
    renderArchive();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layoutSections, 120);
    });
    window.addEventListener('load', layoutSections);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(layoutSections);
    }
  </script>
</body>
</html>
